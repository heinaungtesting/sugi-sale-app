services:
  prisma-test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sugi_prisma_test
      POSTGRES_USER: sugi_test
      POSTGRES_PASSWORD: sugi_test
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - sugi-prisma-test-data:/var/lib/postgresql/data

volumes:
  sugi-prisma-test-data:
